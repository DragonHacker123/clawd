<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /* Wobbling on the edge of something: rocking on his feet, arms windmilling. */
      .teeter { transform-origin: 7.5px 15px; animation: teeter 0.8s infinite ease-in-out; }
      .arm-l-mill { transform-origin: 2px 10px; animation: mill 0.35s infinite linear; }
      .arm-r-mill { transform-origin: 13px 10px; animation: mill 0.35s infinite linear reverse; }
      .sweat { animation: sweat 0.9s infinite ease-in; }
      .alarm { animation: alarm 0.4s infinite steps(1); }

      @keyframes teeter {
        0%, 100% { transform: rotate(-10deg); }
        50% { transform: rotate(10deg); }
      }
      @keyframes mill {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes sweat {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(3px); opacity: 0; }
      }
      @keyframes alarm {
        0% { opacity: 1; }
        50% { opacity: 0.2; }
      }
    </style>
  </defs>

  <rect x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <g class="teeter">
    <g fill="#DE886D">
      <rect x="3" y="13" width="1" height="2"/>
      <rect x="5" y="13" width="1" height="2"/>
      <rect x="9" y="13" width="1" height="2"/>
      <rect x="11" y="13" width="1" height="2"/>
    </g>
    <rect id="torso" x="2" y="6" width="11" height="7" fill="#DE886D"/>
    <g class="arm-l-mill"><rect x="0" y="9" width="2" height="2" fill="#DE886D"/></g>
    <g class="arm-r-mill"><rect x="13" y="9" width="2" height="2" fill="#DE886D"/></g>
    <!-- Wide, worried eyes -->
    <g class="eyes-wide" fill="#000000">
      <rect x="3.7" y="7.6" width="1.6" height="2.4"/>
      <rect x="9.7" y="7.6" width="1.6" height="2.4"/>
    </g>
    <g fill="#FFFFFF">
      <rect x="4.2" y="7.9" width="0.5" height="0.5"/>
      <rect x="10.2" y="7.9" width="0.5" height="0.5"/>
    </g>
    <rect class="sweat" x="13.2" y="5" width="0.8" height="1.1" fill="#40C4FF"/>
  </g>

  <g class="alarm" fill="#FF5252">
    <rect x="7" y="-2.5" width="1" height="2.5"/>
    <rect x="7" y="0.8" width="1" height="1"/>
  </g>
</svg>
