<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /* Grumpy stomp after a nasty fall: furrowed brows, red face, anger mark, steam. */
      .angry-body { animation: angry-shake 0.14s infinite; }
      .stomp-a { animation: stomp-a 0.7s infinite; }
      .stomp-b { animation: stomp-b 0.7s infinite; }
      .fist-l { animation: fist 0.28s infinite alternate ease-in-out; }
      .fist-r { animation: fist 0.28s infinite alternate-reverse ease-in-out; }
      .flush { animation: flush 1.2s infinite ease-in-out; }
      .anger-mark { transform-origin: 13.6px 3.6px; animation: anger-pop 0.9s infinite ease-in-out; }
      .steam { opacity: 0; animation: steam 1.4s infinite ease-out; }
      .steam.s2 { animation-delay: -0.7s; }
      .shadow-angry { transform-origin: 7.5px 15.5px; animation: shadow-stomp 0.7s infinite; }

      @keyframes angry-shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-0.35px); }
        75% { transform: translateX(0.35px); }
      }
      @keyframes stomp-a {
        0%, 35%, 100% { transform: translateY(0); }
        12%, 22% { transform: translateY(-1.5px); }
      }
      @keyframes stomp-b {
        0%, 50%, 85%, 100% { transform: translateY(0); }
        62%, 72% { transform: translateY(-1.5px); }
      }
      @keyframes fist {
        from { transform: translateY(0); }
        to { transform: translateY(-0.8px); }
      }
      @keyframes flush {
        0%, 100% { opacity: 0.12; }
        50% { opacity: 0.3; }
      }
      @keyframes anger-pop {
        0%, 100% { transform: scale(0.85); }
        50% { transform: scale(1.15); }
      }
      @keyframes steam {
        0% { transform: translateY(0); opacity: 0; }
        15% { opacity: 0.8; }
        100% { transform: translateY(-4px); opacity: 0; }
      }
      @keyframes shadow-stomp {
        0%, 100% { transform: scaleX(1); }
        17%, 67% { transform: scaleX(0.92); }
      }
    </style>
  </defs>

  <rect class="shadow-angry" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <g fill="#DE886D">
    <rect class="stomp-a" x="3" y="13" width="1" height="2"/>
    <rect class="stomp-b" x="5" y="13" width="1" height="2"/>
    <rect class="stomp-a" x="9" y="13" width="1" height="2"/>
    <rect class="stomp-b" x="11" y="13" width="1" height="2"/>
  </g>

  <g class="angry-body">
    <rect id="torso" x="2" y="6" width="11" height="7" fill="#DE886D"/>
    <rect class="flush" x="2" y="6" width="11" height="7" fill="#E53935"/>
    <!-- Raised, shaking fists -->
    <g class="fist-l"><rect x="0" y="7" width="2" height="2" fill="#DE886D"/></g>
    <g class="fist-r"><rect x="13" y="7" width="2" height="2" fill="#DE886D"/></g>
    <!-- Furrowed brows (inner ends low) -->
    <g fill="#5D2E1F">
      <rect x="3.3" y="6.9" width="2.8" height="0.7" transform="rotate(22 4.7 7.25)"/>
      <rect x="8.9" y="6.9" width="2.8" height="0.7" transform="rotate(-22 10.3 7.25)"/>
    </g>
    <!-- Narrowed eyes, both visible -->
    <g fill="#000000">
      <rect class="eye-angry" x="4" y="8.6" width="1" height="1.3"/>
      <rect class="eye-angry" x="10" y="8.6" width="1" height="1.3"/>
    </g>
    <!-- Grumpy mouth -->
    <g fill="#5D2E1F">
      <rect x="6" y="11" width="3" height="0.6"/>
      <rect x="5.5" y="11.4" width="0.6" height="0.6"/>
      <rect x="8.9" y="11.4" width="0.6" height="0.6"/>
    </g>
  </g>

  <!-- Anger mark -->
  <g class="anger-mark" fill="#E53935">
    <rect x="12.4" y="2" width="0.6" height="1.2"/>
    <rect x="14.2" y="2" width="0.6" height="1.2"/>
    <rect x="12.4" y="4" width="0.6" height="1.2"/>
    <rect x="14.2" y="4" width="0.6" height="1.2"/>
    <rect x="11.8" y="2.6" width="1.2" height="0.6"/>
    <rect x="14.2" y="2.6" width="1.2" height="0.6"/>
    <rect x="11.8" y="4" width="1.2" height="0.6"/>
    <rect x="14.2" y="4" width="1.2" height="0.6"/>
  </g>

  <!-- Steam from his head -->
  <rect class="steam" x="4" y="3.5" width="1.2" height="1.2" fill="#CFD8DC"/>
  <rect class="steam s2" x="9.5" y="3.5" width="1.2" height="1.2" fill="#CFD8DC"/>
</svg>
