<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /* Walking to the right (mirrored by the app for walking left). */
      .walk-body { animation: walk-bob 0.5s infinite ease-in-out; }
      .leg-a { animation: step-a 0.5s infinite; }
      .leg-b { animation: step-b 0.5s infinite; }
      .arm-l-walk { animation: arm-swing 0.5s infinite ease-in-out; }
      .arm-r-walk { animation: arm-swing 0.5s infinite ease-in-out reverse; }
      .eyes-walk { transform-origin: 7.5px 9px; animation: walk-blink 4.2s infinite; }
      .shadow-walk { transform-origin: 7.5px 15.5px; animation: shadow-walk 0.5s infinite ease-in-out; }

      @keyframes walk-bob {
        0%, 50%, 100% { transform: translateY(0); }
        25%, 75% { transform: translateY(-0.6px); }
      }
      @keyframes step-a {
        0%, 49% { transform: translateY(-1px); }
        50%, 100% { transform: translateY(0); }
      }
      @keyframes step-b {
        0%, 49% { transform: translateY(0); }
        50%, 100% { transform: translateY(-1px); }
      }
      @keyframes arm-swing {
        0%, 100% { transform: translateY(-0.5px); }
        50% { transform: translateY(0.5px); }
      }
      @keyframes walk-blink {
        0%, 46%, 50%, 100% { transform: scaleY(1); }
        48% { transform: scaleY(0.1); }
      }
      @keyframes shadow-walk {
        0%, 50%, 100% { transform: scaleX(1); opacity: 0.5; }
        25%, 75% { transform: scaleX(0.94); opacity: 0.42; }
      }
    </style>
  </defs>

  <rect class="shadow-walk" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <g fill="#DE886D">
    <rect class="leg-a" x="3" y="13" width="1" height="2"/>
    <rect class="leg-b" x="5" y="13" width="1" height="2"/>
    <rect class="leg-a" x="9" y="13" width="1" height="2"/>
    <rect class="leg-b" x="11" y="13" width="1" height="2"/>
  </g>

  <g class="walk-body">
    <rect id="torso" x="2" y="6" width="11" height="7" fill="#DE886D"/>
    <g class="arm-l-walk"><rect x="0" y="9" width="2" height="2" fill="#DE886D"/></g>
    <g class="arm-r-walk"><rect x="13" y="9" width="2" height="2" fill="#DE886D"/></g>
    <!-- Eyes glance one step toward where he's going; both stay on his body. -->
    <g fill="#000000" transform="translate(1 0)">
      <g class="eyes-walk">
        <rect x="4" y="8" width="1" height="2"/>
        <rect x="10" y="8" width="1" height="2"/>
      </g>
    </g>
  </g>
</svg>
