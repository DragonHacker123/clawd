<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; background: #6d7f8f; font: 11px sans-serif; color: #fff; }
  #grid { display: grid; grid-template-columns: repeat(8, 150px); gap: 4px; padding: 4px; }
  .cell { position: relative; width: 150px; height: 168px; background: #8fa3b5; }
  .cell .stage { width: 150px; height: 150px; }
  .cell .stage svg { width: 100%; height: 100%; display: block; }
  .cell span { position: absolute; bottom: 2px; left: 4px; }
</style>
<link rel="stylesheet" href="../renderer/style.css">
<style> html, body { overflow: visible; height: auto; } body { background: #6d7f8f !important; } </style>
</head>
<body>
<div id="grid"></div>
<script src="../renderer/sprites.js"></script>
<script src="../renderer/seasonal.js"></script>
<script>
  const ANIMS = ['clawd-idle-living','clawd-idle-look','clawd-idle-follow','clawd-idle-reading','clawd-idle-yawn','clawd-idle-doze',
    'clawd-collapse-sleep','clawd-sleeping','clawd-wake','clawd-working-thinking','clawd-working-ultrathink','clawd-working-typing',
    'clawd-working-debugger','clawd-working-building','clawd-working-carrying','clawd-working-conducting','clawd-working-juggling',
    'clawd-working-sweeping','clawd-working-wizard','clawd-notification','clawd-happy','clawd-error','clawd-mini-happy','clawd-mini-alert',
    'clawd-react-left','clawd-react-right','clawd-react-double-jump','clawd-react-annoyed','clawd-react-drag','clawd-walk','clawd-angry','clawd-teeter'];
  const d = window.clawd.date();
  const seasonal = window.ClawdSeasonal.forDate(d ? new Date(d + 'T12:00:00') : new Date());
  const outfit = window.clawd.outfit();
  const many = window.clawd.outfits();
  const grid = document.getElementById('grid');
  const jobs = [];
  if (many.length) {
    const ROW = ['clawd-idle-living','clawd-working-typing','clawd-working-thinking','clawd-happy','clawd-mini-happy','clawd-working-sweeping','clawd-react-double-jump','clawd-sleeping'];
    for (const o of many) for (const name of ROW) jobs.push([name, [...seasonal, { id: 'o', ...o }], (o.name || o.file) + ' / ' + name.replace('clawd-', '')]);
  } else {
    const acc = [...seasonal];
    if (outfit) acc.push({ id: 'o', ...outfit });
    for (const name of ANIMS) jobs.push([name, acc, name.replace('clawd-', '')]);
  }
  for (const [name, acc, label] of jobs) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = '<div class="stage"></div><span></span>';
    cell.querySelector('span').textContent = label;
    grid.appendChild(cell);
    // Each SVG's <style> is global once inlined, so isolate cells in shadow roots.
    const host = cell.querySelector('.stage');
    const shadow = host.attachShadow({ mode: 'open' });
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = '../renderer/style.css';
    const inner = document.createElement('div');
    inner.style.cssText = 'width:150px;height:150px';
    shadow.append(link, inner);
    window.ClawdSprites.render(inner, name, acc, window.clawd.opts());
    inner.firstChild.style.cssText = 'width:100%;height:100%;display:block';
  }
</script>
</body>
</html>
